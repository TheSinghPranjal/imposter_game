# Manual production deploy for the Play production track.
# Run from Actions → Production Deploy → Run workflow.
name: Production Deploy

on:
  workflow_dispatch:

# One production upload at a time. A second run waits for the one in progress.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build and ship to production
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Not pinned. pubspec sdk: ^3.11.3 accepts current stable (Dart 3.13).
      # Gradle 8.14, AGP 8.11.1, and Kotlin 2.2.20 are Flutter stable's minimum
      # supported versions, so the Android dependency check only warns.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # This repo gates release packaging on tool/validate_admob.dart.
      # Run it before the version bump so a bad AdMob config does not consume
      # a version code. Gradle runs the same check again inside bundleRelease.
      - name: Validate release AdMob IDs
        run: dart run tool/validate_admob.dart --android

      - name: Bump pubspec build number
        id: version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_bytes().decode("utf-8")
          newline = "\n"
          if "\r\n" in text:
              newline = "\r\n"
          lines = text.splitlines()
          indexes = [i for i, line in enumerate(lines) if line.startswith("version:")]
          if not indexes:
              sys.exit(
                  "error: pubspec.yaml has no top-level version: line. "
                  "Expected a line like version: 1.0.0+1."
              )
          if len(indexes) != 1:
              sys.exit(
                  "error: pubspec.yaml has "
                  f"{len(indexes)} top-level version: lines. Expected exactly one."
              )

          index = indexes[0]
          core = lines[index]
          match = re.fullmatch(
              r'(version:\s*)(?:"([^"]*)"|\'([^\']*)\'|(\S+))(\s*(?:#.*)?)',
              core,
          )
          if match is None:
              sys.exit(
                  "error: could not parse the pubspec version line: "
                  f"{core!r}. Expected version: 1.0.0+1."
              )
          if match.group(2) is not None:
              quote = '"'
              value = match.group(2)
          elif match.group(3) is not None:
              quote = "'"
              value = match.group(3)
          else:
              quote = ""
              value = match.group(4)

          if "+" not in value:
              sys.exit(
                  f"error: pubspec version {value!r} is missing the +build number. "
                  "Expected a version like 1.0.0+1."
              )
          if value.count("+") != 1:
              sys.exit(
                  f"error: pubspec version {value!r} must contain exactly one "
                  "+build suffix, for example 1.0.0+1."
              )
          build_name, build_text = value.split("+", 1)
          if build_name == "":
              sys.exit(
                  f"error: pubspec version {value!r} is missing the version name "
                  "before +."
              )
          if re.fullmatch(r"[0-9]+", build_text) is None or int(build_text) < 1:
              sys.exit(
                  f"error: pubspec build number {build_text!r} is not a positive "
                  "integer. The +build part must be an integer greater than zero."
              )

          build_number = int(build_text) + 1
          bumped = f"{build_name}+{build_number}"
          lines[index] = (
              f"{match.group(1)}{quote}{bumped}{quote}{match.group(5)}"
          )
          updated = newline.join(lines)
          if text.endswith(("\n", "\r\n")):
              updated += newline
          if updated == text:
              sys.exit("error: version bump did not change pubspec.yaml.")
          path.write_bytes(updated.encode("utf-8"))

          output = os.environ.get("GITHUB_OUTPUT")
          if not output:
              sys.exit("error: GITHUB_OUTPUT is not set.")
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"version={bumped}\n")
              handle.write(f"build_name={build_name}\n")
              handle.write(f"build_number={build_number}\n")
          print(f"Bumped pubspec version to {bumped}")
          PY

      # flutter pub get on stable can rewrite the tracked pubspec.lock.
      # Commit only pubspec.yaml. A dirty lock is expected; any other
      # leftover path fails the job.
      - name: Commit and push version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pubspec.yaml
          staged="$(git diff --cached --name-only)"
          if [[ "${staged}" != "pubspec.yaml" ]]; then
            echo "::error::version bump must stage only pubspec.yaml."
            printf '%s\n' "${staged}"
            exit 1
          fi
          git commit -m "chore: bump version to ${VERSION}"
          git push origin HEAD:main
          unexpected="$(
            git status --porcelain --untracked-files=all | while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              path="${line:3}"
              if [[ "${path}" == "pubspec.lock" ]]; then
                continue
              fi
              printf '%s\n' "${line}"
            done
          )"
          if [[ -n "${unexpected}" ]]; then
            echo "::error::version bump left unexpected working tree changes"
            printf '%s\n' "${unexpected}"
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/upload-keystore.jks
          if [[ ! -s android/app/keystore/upload-keystore.jks ]]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a keystore."
            exit 1
          fi

      - name: Write android/key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          required = ("KEYSTORE_PASSWORD", "KEY_PASSWORD", "KEY_ALIAS")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              sys.exit(
                  "error: missing signing secret(s): " + ", ".join(missing) + "."
              )

          def prop_escape(value: str) -> str:
              # android/app/build.gradle.kts loads key.properties with
              # Properties.load(InputStream), which decodes ISO-8859-1 escapes.
              escaped = []
              for char in value:
                  code = ord(char)
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char == "\n":
                      escaped.append("\\n")
                  elif char == "\r":
                      escaped.append("\\r")
                  elif char == "\t":
                      escaped.append("\\t")
                  elif char in "=: #!":
                      escaped.append("\\" + char)
                  elif code < 0x20 or code > 0x7E:
                      escaped.append(f"\\u{code:04x}")
                  else:
                      escaped.append(char)
              return "".join(escaped)

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          store_file = (
              workspace / "android" / "app" / "keystore" / "upload-keystore.jks"
          )
          if not store_file.is_file():
              sys.exit(f"error: keystore was not restored at {store_file}.")

          contents = "\n".join(
              [
                  f"storePassword={prop_escape(os.environ['KEYSTORE_PASSWORD'])}",
                  f"keyPassword={prop_escape(os.environ['KEY_PASSWORD'])}",
                  f"keyAlias={prop_escape(os.environ['KEY_ALIAS'])}",
                  f"storeFile={prop_escape(str(store_file))}",
                  "",
              ]
          )
          Path("android/key.properties").write_text(contents, encoding="ascii")
          print(f"Wrote android/key.properties with storeFile={store_file}")
          PY

      # android/gradle.properties asks for -Xmx8G. Public ubuntu-latest has
      # 16 GB RAM, so this job keeps that setting.
      - name: Build release app bundle
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Verify bundle version with bundletool
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          if [[ ! -s "$aab" ]]; then
            echo "::error::Release app bundle was not produced at ${aab}."
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          manifest_attr() {
            java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
              --bundle="$aab" \
              --xpath "$1" | tr -d '[:space:]'
          }
          actual_code="$(manifest_attr /manifest/@android:versionCode)"
          actual_name="$(manifest_attr /manifest/@android:versionName)"
          actual_package="$(manifest_attr /manifest/@package)"
          expected_package="com.the_lazy_bear_club.imposter_game"
          if [[ "$actual_code" != "$BUILD_NUMBER" || "$actual_name" != "$BUILD_NAME" || "$actual_package" != "$expected_package" ]]; then
            echo "::error::Bundle manifest mismatch. Expected versionName=${BUILD_NAME} versionCode=${BUILD_NUMBER} package=${expected_package}. Got versionName=${actual_name} versionCode=${actual_code} package=${actual_package}."
            exit 1
          fi
          echo "Bundle manifest matches ${actual_name}+${actual_code} (${actual_package})."

      - name: Upload to Play production
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.the_lazy_bear_club.imposter_game
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed

      - name: Note on duplicate version codes
        if: failure()
        run: |
          echo "::notice::If Google Play rejected the upload because that version code was already used, run Production Deploy again. Each run bumps the pubspec build number by 1 and pushes it to main before uploading."
